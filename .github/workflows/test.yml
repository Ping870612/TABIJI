name: Test and build
on:
  pull_request:
  push:
    branches: ["fix/performance-collaboration-mobile-20261101"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run build
        env:
          CI: "true"
